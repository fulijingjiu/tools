<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
  </head>
  <body>
    <script>
      (() => {
        const basePath = '/tools'
        const appPath = window.location.pathname.startsWith(`${basePath}/`)
          ? window.location.pathname.slice(basePath.length)
          : '/'
        const path = appPath + window.location.search + window.location.hash
        const target = encodeURIComponent(path)
        window.location.replace(`${basePath}/?_spa_redirect=${target}`)
      })()
    </script>
  </body>
</html>
